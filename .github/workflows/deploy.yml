# Jeder Push auf main: testen, Image bauen und nach GHCR, per SSH auf dem VPS ausrollen.
# Pull Requests: nur testen und bauen, nichts veröffentlichen.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/konnz/rechase

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            app.rechase.image=true
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Bis die Variable VPS_HOST gesetzt ist, wird nur gebaut.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    # Nie zwei Deployments gleichzeitig; ein neuer Push wartet, bis der laufende fertig ist.
    concurrency:
      group: deploy-rechase
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      TARGET: rechase@${{ vars.VPS_HOST }}
      PORT: ${{ vars.VPS_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH-Schlüssel
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Compose-Datei und Skript kopieren
        run: scp -P "$PORT" -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes compose.yaml deploy/update.sh "$TARGET:/opt/rechase/"
      - name: Ausrollen
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Token per stdin, damit es auf dem VPS nicht in der Prozessliste steht.
          {
            printf 'export GHCR_USER=%q GHCR_TOKEN=%q\n' "${{ github.actor }}" "$GHCR_TOKEN"
            printf 'cd /opt/rechase && chmod 750 update.sh && exec ./update.sh %q\n' "${{ github.sha }}"
          } | ssh -p "$PORT" -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$TARGET" 'bash -s'
      - name: Aufräumen
        if: always()
        run: rm -f ~/.ssh/id_deploy
