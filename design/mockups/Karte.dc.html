<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Karte im Folgemodus</title>
<script src="./vendor/react.js"></script>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0D0F12}
a{color:#F2F4F7}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0F12; color: #F2F4F7; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 12px; padding: 20px 20px 8px;">
    <a href="Main.dc.html" aria-label="Zurück zur Fahransicht" style="width: 44px; height: 44px; border-radius: 12px; background: #1A1D23; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
      <span style="font-size: 17px; font-weight: 600; line-height: 1.2;">Hausrunde Isar</span>
      <span style="font-size: 13px; color: #9AA3AF; line-height: 1.2;">Karte · folgt dir</span>
    </div>
    <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #FF453A; flex-shrink: 0;"></span>
  </div>

  <div style="position: relative; height: 460px; flex-shrink: 0; overflow: hidden; background: #12151A;">
    <svg aria-hidden="true" width="390" height="460" viewBox="0 0 390 480" preserveAspectRatio="xMidYMid slice" style="position: absolute; left: 0; top: 0;">
      <rect x="0" y="0" width="390" height="480" fill="#12151A"></rect>
      <rect x="14" y="150" width="96" height="110" rx="14" fill="#15201A"></rect>
      <path d="M352,0 C330,140 392,290 356,480" fill="none" stroke="#1A2735" stroke-width="30"></path>
      <path d="M0,120 L390,70" fill="none" stroke="#1E2329" stroke-width="10"></path>
      <path d="M0,330 L390,270" fill="none" stroke="#1E2329" stroke-width="10"></path>
      <path d="M0,420 L390,395" fill="none" stroke="#1E2329" stroke-width="8"></path>
      <path d="M90,0 L40,480" fill="none" stroke="#1E2329" stroke-width="8"></path>
      <path d="M150,480 L172,360 L236,250 L262,140 L246,0" fill="none" stroke="#262B33" stroke-width="16" stroke-linejoin="round"></path>
      <path d="M210.4,294 L236,250 L262,140 L246,0" fill="none" stroke="#4A515C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M150,480 L172,360 L210.4,294" fill="none" stroke="{{you}}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M210.4,294 L236,250 L243.8,217" fill="none" stroke="{{ghost}}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 8"></path>
      <circle cx="243.8" cy="217" r="18" fill="{{ghost}}" fill-opacity="0.12"></circle>
      <circle cx="243.8" cy="217" r="9" fill="{{ghost}}" fill-opacity="0.35" stroke="{{ghost}}" stroke-width="2" stroke-dasharray="3 2"></circle>
      <circle cx="210.4" cy="294" r="22" fill="{{you}}" fill-opacity="0.18"></circle>
      <circle cx="210.4" cy="294" r="11" fill="{{you}}" stroke="#0D0F12" stroke-width="3"></circle>
      <text x="364" y="214" fill="#5D7A97" font-size="12" font-family="Barlow, sans-serif" font-weight="600" letter-spacing="2" transform="rotate(80 364 214)">ISAR</text>
    </svg>

    <div style="position: absolute; left: 258px; top: 194px; padding: 3px 8px; border-radius: 8px; border: 1.5px dashed {{ghost}}; background: rgba(13,15,18,0.78); font-size: 12px; font-weight: 600; color: {{ghost}};">Bestzeit</div>
    <div style="position: absolute; left: 128px; top: 282px; padding: 3px 9px; border-radius: 8px; background: {{you}}; font-size: 12px; font-weight: 700; color: #0D0F12;">Du</div>

    <div style="position: absolute; left: 14px; top: 14px; display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border-radius: 12px; background: rgba(13,15,18,0.82);">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9AA3AF;">Strecke</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 600; line-height: 1;">18,2 <span style="font-size: 14px; color: #9AA3AF;">/ 24,6 km</span></span>
    </div>

    <div style="position: absolute; right: 14px; top: 14px; width: 92px; height: 92px; border-radius: 14px; background: rgba(13,15,18,0.82); display: flex; align-items: center; justify-content: center;">
      <svg role="img" aria-label="Übersicht der ganzen Runde, 74 Prozent gefahren" width="80" height="80" viewBox="0 0 80 80">
        <path d="M14,70 L14,38 L30,20 L62,16 L66,48 L50,72 Z" pathLength="100" fill="none" stroke="#3A404A" stroke-width="3" stroke-linejoin="round"></path>
        <path d="M14,70 L14,38 L30,20 L62,16 L66,48 L50,72 Z" pathLength="100" fill="none" stroke="{{you}}" stroke-width="3" stroke-linejoin="round" stroke-dasharray="74 100"></path>
        <circle cx="58.5" cy="59.3" r="4" fill="{{you}}" stroke="#0D0F12" stroke-width="1.5"></circle>
        <circle cx="14" cy="70" r="3" fill="#F2F4F7"></circle>
      </svg>
    </div>

    <button type="button" aria-label="Karte auf mich zentrieren" style="position: absolute; right: 14px; bottom: 34px; width: 44px; height: 44px; border-radius: 12px; border: 0; background: #1A1D23; color: #F2F4F7; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
    </button>
  </div>

  <div style="margin-top: -20px; position: relative; flex-grow: 1; border-radius: 24px 24px 0 0; background: #171A1F; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 14px;">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #3A404A;"></span>
    <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 0 4px;">
      <div style="display: flex; flex-direction: column;">
        <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: {{ghost}};">Bestzeit liegt vorn</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 46px; font-weight: 700; line-height: 0.95; color: {{ghost}};">−38 m</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding-bottom: 4px;">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600; line-height: 1;">5,2 s</span>
        <span style="font-size: 13px; font-weight: 600; color: {{you}};">du holst auf</span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <div style="background: #0F1216; border-radius: 14px; padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9AA3AF;">Tempo</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600; line-height: 1;">31,4</span>
      </div>
      <div style="background: #0F1216; border-radius: 14px; padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9AA3AF;">Fahrzeit</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600; line-height: 1;">42:18</span>
      </div>
      <div style="background: #0F1216; border-radius: 14px; padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9AA3AF;">Höhe</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600; line-height: 1;">214 <span style="font-size: 14px; color: #9AA3AF;">hm</span></span>
      </div>
    </div>
    <a href="Main.dc.html" style="height: 52px; border-radius: 14px; background: {{you}}; color: #0D0F12; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; text-decoration: none;">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"></path><path d="M6 21 10 3M18 21 14 3"></path></svg>
      Zur Fahransicht
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"youColor":{"editor":"color","default":"#FF7A1A","options":["#FF7A1A","#E8FF4A","#FF5C8A"],"section":"Farben"},"ghostColor":{"editor":"color","default":"#A9C1FF","options":["#A9C1FF","#7FE3FF","#D7D9E0"],"section":"Farben"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      you: this.props.youColor ?? '#FF7A1A',
      ghost: this.props.ghostColor ?? '#A9C1FF'
    };
  }
}
</script>
</body>
</html>
