<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Figur</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; font-family: 'Barlow Condensed', sans-serif;">

  <sc-if value="{{isPfeil}}" hint-placeholder-val="{{ true }}">
    <svg role="img" aria-label="{{aria}}" width="100%" viewBox="0 0 40 56" style="display: block; overflow: visible;">
      <ellipse cx="20" cy="52" rx="14" ry="3" fill="#000000" fill-opacity="0.35"></ellipse>
      <path d="M20 6 L36 50 L20 41 L4 50 Z" fill="{{c}}" fill-opacity="{{fillOp}}" stroke="{{edge}}" stroke-width="2" stroke-dasharray="{{dash}}" stroke-linejoin="round"></path>
      <path d="M20 6 L20 41 L4 50 Z" fill="#FFFFFF" fill-opacity="{{shine}}"></path>
    </svg>
  </sc-if>

  <sc-if value="{{isLicht}}" hint-placeholder-val="{{ false }}">
    <svg role="img" aria-label="{{aria}}" width="100%" viewBox="0 0 40 56" style="display: block; overflow: visible;">
      <path d="M12 40 L28 40 L23 56 L17 56 Z" fill="{{c}}" fill-opacity="0.35"></path>
      <circle cx="20" cy="36" r="16" fill="{{c}}" fill-opacity="{{haloOp}}"></circle>
      <circle cx="20" cy="36" r="8.5" fill="{{c}}" fill-opacity="{{fillOp}}" stroke="{{ringEdge}}" stroke-width="2" stroke-dasharray="{{dash}}"></circle>
      <circle cx="17.5" cy="33.5" r="2.5" fill="#FFFFFF" fill-opacity="{{shine}}"></circle>
    </svg>
  </sc-if>

  <sc-if value="{{isPlakette}}" hint-placeholder-val="{{ false }}">
    <svg role="img" aria-label="{{aria}}" width="100%" viewBox="0 0 40 56" style="display: block; overflow: visible;">
      <ellipse cx="20" cy="54" rx="6" ry="1.6" fill="#000000" fill-opacity="0.4"></ellipse>
      <path d="M13.5 32 L20 54 L26.5 32 Z" fill="{{c}}" fill-opacity="{{fillOp}}"></path>
      <circle cx="20" cy="19" r="15" fill="{{c}}" fill-opacity="{{fillOp}}" stroke="{{edge}}" stroke-width="2" stroke-dasharray="{{dash}}"></circle>
      <text x="20" y="24" text-anchor="middle" font-family="'Barlow Condensed', sans-serif" font-weight="700" font-size="14" fill="{{labelColor}}">{{label}}</text>
    </svg>
  </sc-if>

  <sc-if value="{{isFahrer}}" hint-placeholder-val="{{ false }}">
    <svg role="img" aria-label="{{aria}}" width="100%" viewBox="0 0 40 56" style="display: block; overflow: visible;">
      <ellipse cx="20" cy="55" rx="9" ry="1.8" fill="#000000" fill-opacity="0.4"></ellipse>
      <rect x="18.5" y="38" width="3" height="18" rx="1.5" fill="{{c}}" fill-opacity="{{limbOp}}"></rect>
      <path d="M15 36 L16.5 48 M25 36 L23.5 45" fill="none" stroke="{{c}}" stroke-opacity="{{limbOp}}" stroke-width="3.5" stroke-linecap="round"></path>
      <path d="M8 33 Q20 30 32 33" fill="none" stroke="{{c}}" stroke-opacity="{{limbOp}}" stroke-width="2" stroke-linecap="round"></path>
      <path d="M8 33 C8 24 13 20 20 20 C27 20 32 24 32 33 C28 36 24 37 20 37 C16 37 12 36 8 33 Z" fill="{{c}}" fill-opacity="{{fillOp}}" stroke="{{ringEdge}}" stroke-width="1.5" stroke-dasharray="{{dash}}"></path>
      <path d="M20 23 L20 34" fill="none" stroke="#0D0F12" stroke-opacity="{{seamOp}}" stroke-width="1.2" stroke-linecap="round"></path>
      <path d="M14 17 C14 11.5 17 9 20 9 C23 9 26 11.5 26 17 C24 19 16 19 14 17 Z" fill="{{c}}" fill-opacity="{{fillOp}}" stroke="{{ringEdge}}" stroke-width="1.5" stroke-dasharray="{{dash}}"></path>
    </svg>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["pfeil","licht","plakette","fahrer"],"default":"pfeil"},"ghost":{"editor":"boolean","default":false},"color":{"editor":"color","default":"#FF7A1A"},"$preview":{"width":80,"height":112}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? 'pfeil';
    const g = !!this.props.ghost;
    const c = this.props.color ?? (g ? '#A9C1FF' : '#FF7A1A');
    return {
      isPfeil: v === 'pfeil',
      isLicht: v === 'licht',
      isPlakette: v === 'plakette',
      isFahrer: v === 'fahrer',
      c: c,
      fillOp: g ? 0.3 : 1,
      limbOp: g ? 0.6 : 1,
      haloOp: g ? 0.12 : 0.25,
      shine: g ? 0 : 0.18,
      seamOp: g ? 0 : 0.35,
      dash: g ? '3 2' : 'none',
      edge: g ? c : '#0D0F12',
      ringEdge: g ? c : 'none',
      label: g ? 'BZ' : 'DU',
      labelColor: g ? c : '#0D0F12',
      aria: g ? 'Ghost deiner Bestzeit' : 'Du'
    };
  }
}
</script>
</body>
</html>
